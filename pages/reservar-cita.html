<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" href="../assets/icon/logo-2.jpg">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/box-model.css">
    <link rel="stylesheet" href="../css/reservar-cita.css">
    <script src="../js/cambiar-tema.js" defer></script>
    <script src="../js/buscador.js" defer></script> 
    <script type="module" src="../js/reservar.js"></script>

    <title>Elegir servicio | Pepe's Barberia</title>
</head>

<body>
    <main class="main--buscador">
    <h1 class="reservar__titulo">Servicios Disponibles</h1>
    <a class="reservar__flecha--regresar" href="../index.html" aria-label="Regresar a servicios"></a>

    <input class="reservar__buscador" 
        type="text" id="buscador" placeholder="Buscar servicio..." aria-label="Buscar servicio">

    <ul class="reservar__lista" id="servicios-lista"></ul>

    <aside class="panel__lateral">
        <section class="barberia">
            <img class="barberia__logo" src="../assets/icon/logo-2.jpg" alt="Logo de Barbas Barberia">
            <h2 class="barberia__nombre">Barbas Barberia</h2>

            <p class="barberia__resenas"> 4.7
                <span class="barberia__estrellas" role="img" aria-label="4.7 de 5 estrellas"></span> 
                1,389 reseñas
            </p>

            <p class="barberia__direccion">Allende 1560, colonia Perla, C.P. 23040</p>
        </section>

        <section class="resumen">
            <h2 class="resumen__titulo">Resumen</h2>

            <ul class="resumen__lista" id="resumen-lista"></ul>
         </section>
         <button class="lateral__continuar" type="button">Continuar</button>

    </aside>

    </main>

    <template id="tpl-servicio">
        <li class="reservar__item">
            <input class="servicio__radio" type="radio" name="servicio">
            <label class="servicio">
                <span class="servicio__nombre"></span>
                <span class="servicio__detalle"></span>
            </label>
        </li>
    </template>

</body>
</html>
